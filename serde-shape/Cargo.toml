[package]
name = "serde-shape"
version = "0.1.0"

categories = ["development-tools", "encoding"]
description = "Inspectable graphs of Serde serialization and deserialization shapes."
documentation = "https://docs.rs/serde-shape"
keywords = ["serde", "derive", "reflection", "schema", "shape"]

edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
derive = ["dep:serde-shape-derive"]
jiff02 = ["dep:jiff02"]
std = []

[dependencies]
jiff02 = { package = "jiff", version = "0.2", default-features = false, optional = true }
serde-shape-derive = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }

[lints]
workspace = true

[[example]]
name = "inspect_config"
path = "examples/inspect_config.rs"
required-features = ["derive"]
